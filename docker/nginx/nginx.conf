user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=query_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=command_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=batch_limit:10m rate=10r/m;

    # Upstream definitions (API servers will be added here)
    upstream api_servers {
        # API servers will be configured here when they're added
        # Example: server api-server-1:5000;
        # For now, return 503 Service Unavailable
        server 127.0.0.1:9999 down;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 503 '{"error": "API servers not yet configured"}';
            add_header Content-Type application/json;
        }
    }

    # Main API server configuration (placeholder)
    server {
        listen 80;
        server_name api.cwars.local localhost;

        client_body_timeout 60s;
        client_header_timeout 60s;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # Client body size limit
        client_max_body_size 1M;

        # Authentication endpoints (rate limited)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            add_header X-RateLimit-Limit "10/minute" always;
            
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Query endpoints (higher rate limit)
        location ~ ^/api/(units|buildings|world)$ {
            limit_req zone=query_limit burst=20 nodelay;
            limit_req_status 429;

            add_header X-RateLimit-Limit "100/minute" always;
            
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Batch endpoint (low rate limit)
        location /api/batch {
            limit_req zone=batch_limit burst=3 nodelay;
            limit_req_status 429;

            add_header X-RateLimit-Limit "10/minute" always;
            
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Command endpoints (medium rate limit)
        location ~ ^/api/(units/|buildings/) {
            limit_req zone=command_limit burst=10 nodelay;
            limit_req_status 429;

            add_header X-RateLimit-Limit "30/minute" always;
            
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint
        location /ws {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Default catch-all
        location / {
            return 503 '{"error": "API servers not yet configured"}';
            add_header Content-Type application/json;
        }
    }
}
